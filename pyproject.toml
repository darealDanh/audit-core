[project]
name = "audit-suite"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# xdist is a harness dependency, not a shipped one: `dependencies` above
# stays empty so the installed skill remains standard-library only.
dev = ["pytest>=8", "pytest-xdist>=3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
