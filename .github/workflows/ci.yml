# CI runs the same gates `make check` runs locally. There is no separate CI
# script to drift out of step with the harness: if a gate exists in
# scripts/harness.py it runs here, and if it does not, it does not.
#
# The bench gate is included via `--all` and will SKIP on a runner - its
# measurement corpus lives outside the repository on the operator's machine.
# A skip is reported, not swallowed.
name: check

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor declared in pyproject.toml; the others guard
        # against a stdlib change breaking a floor we claim to support.
        python: ["3.10", "3.12", "3.13"]
    steps:
      # The repository ships a deliberate mix of CRLF and LF files (see
      # scripts/eol-manifest.txt). Any checkout that normalises line endings
      # makes the eol gate fail for a reason that has nothing to do with the
      # change under test, so pin it off before the tree lands.
      - name: Do not let git rewrite line endings
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # audit_core is stdlib-only by contract; pytest is the sole dev
      # dependency. Installing anything else here would hide a violation.
      - name: Install the one dev dependency
        run: python -m pip install --upgrade pip 'pytest>=8'

      - name: Gates
        run: python scripts/harness.py --all

      - name: Gate report (JSON)
        if: always()
        run: python scripts/harness.py --all --json > harness-${{ matrix.python }}.json || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harness-report-${{ matrix.python }}
          path: harness-${{ matrix.python }}.json
